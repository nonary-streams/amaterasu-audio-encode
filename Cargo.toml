[package]
name = "amaterasu-audio-encode"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
amaterasu-module-sdk = { git = "file:///tmp/amaterasu-modular-repos/foundation", rev = "51ef23b1923335e0bb0c6af9eef685c6f4807520" }
amaterasu-media = { git = "file:///tmp/amaterasu-modular-repos/foundation", rev = "51ef23b1923335e0bb0c6af9eef685c6f4807520" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
opusic-sys = { version = "=0.7.5", default-features = false, features = ["bundled"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
