[package]
license = "MIT"
name = "amaterasu-audio-encode"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
amaterasu-module-sdk = { git = "https://github.com/nonary-streams/amaterasu-sdk.git", rev = "37e007d102be65041e9817c63495e308bfc0b369" }
amaterasu-media = { git = "https://github.com/nonary-streams/amaterasu-sdk.git", rev = "37e007d102be65041e9817c63495e308bfc0b369" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
opusic-sys = { version = "=0.7.5", default-features = false, features = ["bundled"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
