[package]
name = "amaterasu-audio-encode"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/nonary-streams/amaterasu-audio-encode"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
amaterasu-module-sdk.workspace = true
amaterasu-media.workspace = true
serde.workspace = true
serde_json.workspace = true
getrandom = "0.3"
opusic-sys = { version = "=0.7.5", default-features = false, features = ["bundled"] }

[lints]
workspace = true
